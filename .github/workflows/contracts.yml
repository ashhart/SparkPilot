name: Contracts

on:
  push:
    paths:
      - "contracts/**"
      - "apple/Packages/SparkAPI/**"
      - "runtime/crates/spark-contracts/**"
      - "runtime/Cargo.lock"
      - "rust-toolchain.toml"
      - "database/**"
      - "recipes/**"
      - "tools/**"
      - "config/**"
      - "packaging/**"
      - "Justfile"
      - "docs/build/source-lock.json"
      - "docs/build/sbom.cdx.json"
      - "apple/**/Package.resolved"
      - "tests/sbom/**"
      - ".github/workflows/contracts.yml"
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.94.0"
          components: "rustfmt"
      - name: Install validator deps
        run: python -m pip install --disable-pip-version-check --require-hashes -r tools/requirements-contracts.txt
      - name: Validate full OpenAPI and reject duplicate YAML keys
        run: python -m unittest discover -s tests/contract -p 'test_*.py'
      - name: Validate sources and generated-binding drift
        run: CONTRACT_PYTHON=python ./tools/generate-clients.sh --check
      - name: Compile and test Rust contract bindings
        run: cargo test --manifest-path runtime/Cargo.toml -p spark-contracts --locked
      - name: Check the SBOM against the committed lockfiles
        run: |
          python tools/generate_sbom.py --check
          python -m unittest discover -s tests/sbom -p 'test_*_matrix.py'
      - name: Check the PLAN §49 test matrices
        run: |
          for suite in security integration fault-injection hardware ui; do
            echo "== tests/$suite"
            python -m unittest discover -s "tests/$suite" -p 'test_*_matrix.py'
          done

name: Source quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned lexical checker
        run: python -m pip install --disable-pip-version-check --require-hashes -r tools/requirements-quality.txt
      - name: Test checker language and ownership boundaries
        run: python -m unittest discover -s tests/code-quality -p 'test_*.py'
      - name: Enforce source size and explanation limits
        run: python tools/check_code_quality.py --notices tests/code-quality/notices.json

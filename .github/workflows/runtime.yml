name: Runtime

on:
  push:
    paths:
      - "runtime/**"
      - "recipes/**"
      - "packaging/catalogue/**"
      - "tests/development-launcher.test.cjs"
      - "tests/development-cache.test.cjs"
      - "contracts/**"
      - "rust-toolchain.toml"
      - "Justfile"
      - "tools/test-terminal-stop.py"
      - ".cargo/audit.toml"
      - ".github/workflows/runtime.yml"
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.94.0"
          components: "rustfmt,clippy"
      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          workspaces: "runtime -> target"
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features --locked --no-fail-fast
      - name: Development launcher
        run: node --test ../tests/development-launcher.test.cjs
      - name: Container terminal shutdown
        working-directory: ${{ github.workspace }}
        run: python3 tools/test-terminal-stop.py
      - name: Security audit
        working-directory: ${{ github.workspace }}
        run: |
          cargo install --locked --version 0.22.2 cargo-audit
          cargo audit --file runtime/Cargo.lock

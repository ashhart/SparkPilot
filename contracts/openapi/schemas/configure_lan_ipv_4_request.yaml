type: object
additionalProperties: false
required:
- address
- prefix_length
- gateway
- dns_servers
properties:
  address:
    type: string
    format: ipv4
  prefix_length:
    type: integer
    minimum: 1
    maximum: 30
  gateway:
    type: string
    format: ipv4
  dns_servers:
    type: array
    minItems: 1
    maxItems: 3
    uniqueItems: true
    items:
      type: string
      format: ipv4

type: object
additionalProperties: false
required:
- port_id
- interfaces
- physical_link
- addresses
- routes
- peer_proof
properties:
  port_id:
    type: string
    minLength: 1
    maxLength: 256
  interfaces:
    type: array
    maxItems: 16
    items:
      type: string
      minLength: 1
      maxLength: 64
  physical_link:
    type: string
    enum:
    - down
    - carrier
    - speed_mismatch
    - negotiated_200_gbe
  negotiated_speed_mbps:
    type:
    - integer
    - 'null'
    minimum: 1
  mtu:
    type:
    - integer
    - 'null'
    minimum: 1
  addresses:
    type: array
    maxItems: 64
    items:
      type: string
      minLength: 1
      maxLength: 64
  routes:
    type: array
    maxItems: 128
    items:
      type: string
      minLength: 1
      maxLength: 160
  peer_proof:
    type: string
    enum:
    - unknown
    - candidate
    - authenticated_node
    - switch_port
  authenticated_peer_node_id:
    type:
    - string
    - 'null'
    format: uuid
  peer_proof_expires_at:
    type:
    - string
    - 'null'
    format: date-time

type: object
additionalProperties: false
required:
- state
- model_id
- profile_id
- recipe_revision
- source_revision
- recipe_digest
- signature_key_id
- active_requests
- reserved_memory_bytes
properties:
  state:
    type: string
  model_id:
    type: string
  profile_id:
    type: string
  recipe_revision:
    type: string
  source_revision:
    type: string
  recipe_digest:
    type: string
    pattern: ^[a-f0-9]{64}$
  signature_key_id:
    type: string
  active_requests:
    type: integer
    minimum: 0
  reserved_memory_bytes:
    type: integer
    minimum: 0

type: object
additionalProperties: false
required:
- workload_id
- engine
- ownership
- availability
- observed_at
- sample_age_seconds
- served_model
- engine_uptime_seconds
- total_requests
- prompt_tokens
- generated_tokens
- total_tokens
- running_requests
- queue_depth
- prompt_tokens_per_second
- generation_tokens_per_second
- request_latency_ms
- time_to_first_token_ms
- time_per_output_token_ms
properties:
  workload_id:
    type: string
    minLength: 1
    maxLength: 64
  engine:
    type: string
    enum:
    - vllm
    - sglang
  ownership:
    type: string
    enum:
    - spark_managed
    - external_observed
  availability:
    type: string
    enum:
    - live
    - cached
    - unavailable
    - unsupported
    description: unsupported means this runtime recognises the engine but has no verified parser for its
      metrics. unavailable means a supported endpoint could not produce a bounded sample.
  observed_at:
    type:
    - string
    - 'null'
    format: date-time
  sample_age_seconds:
    type:
    - integer
    - 'null'
    minimum: 0
  served_model:
    type:
    - string
    - 'null'
    maxLength: 240
  engine_uptime_seconds:
    type:
    - integer
    - 'null'
    minimum: 0
  total_requests:
    type:
    - integer
    - 'null'
    minimum: 0
  prompt_tokens:
    type:
    - integer
    - 'null'
    minimum: 0
  generated_tokens:
    type:
    - integer
    - 'null'
    minimum: 0
  total_tokens:
    type:
    - integer
    - 'null'
    minimum: 0
  running_requests:
    type:
    - integer
    - 'null'
    minimum: 0
  queue_depth:
    type:
    - integer
    - 'null'
    minimum: 0
  prompt_tokens_per_second:
    type:
    - number
    - 'null'
    minimum: 0
  generation_tokens_per_second:
    type:
    - number
    - 'null'
    minimum: 0
  request_latency_ms:
    type:
    - number
    - 'null'
    minimum: 0
  time_to_first_token_ms:
    type:
    - number
    - 'null'
    minimum: 0
  time_per_output_token_ms:
    type:
    - number
    - 'null'
    minimum: 0

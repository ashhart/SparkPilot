type: object
additionalProperties: false
required:
- worker_id
- platform
- xcode_version
- architectures
properties:
  worker_id:
    type: string
    format: uuid
  platform:
    type: string
    const: macOS
  xcode_version:
    type: string
    minLength: 1
    maxLength: 64
  sdk_versions:
    type: array
    maxItems: 64
    items:
      type: string
      minLength: 1
      maxLength: 200
  architectures:
    type: array
    minItems: 1
    maxItems: 16
    items:
      type: string
      minLength: 1
      maxLength: 64
  simulators:
    type: array
    maxItems: 128
    items:
      type: string
      minLength: 1
      maxLength: 200
  signing_available:
    type: boolean
    default: false
  max_concurrent_jobs:
    type: integer
    minimum: 1
    maximum: 8
    default: 1

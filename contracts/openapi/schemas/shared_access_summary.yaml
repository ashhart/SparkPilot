type: object
additionalProperties: false
required:
- display_name
- allowed_models
- allowed_hours
- time_zone
- max_concurrent_requests
- daily_token_budget
description: The limits carried inside a signed shared-access invitation, so the friend can read them
  before joining and nobody can alter them on the way.
properties:
  display_name:
    type: string
  allowed_models:
    type: array
    items:
      type: string
  allowed_hours:
    type: array
    minItems: 7
    maxItems: 7
    items:
      $ref: ../../openapi.yaml#/components/schemas/GuestDaySchedule
  time_zone:
    type: string
  max_concurrent_requests:
    type: integer
  daily_token_budget:
    type: integer
  expires_at:
    type:
    - integer
    - 'null'

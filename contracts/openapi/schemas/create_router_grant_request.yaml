type: object
additionalProperties: false
required:
- pool_id
- policy_revision
- router_device_id
- caller_device_id
- deployment_ids
- actions
- expires_in_seconds
properties:
  pool_id:
    type: string
    format: uuid
  policy_revision:
    type: integer
    format: int64
    minimum: 0
  router_device_id:
    type: string
    format: uuid
  caller_device_id:
    type: string
    format: uuid
  deployment_ids:
    type: array
    items:
      type: string
    minItems: 1
    maxItems: 16
  actions:
    type: array
    items:
      $ref: ../../openapi.yaml#/components/schemas/RouterAction
    minItems: 1
    maxItems: 4
  expires_in_seconds:
    type: integer
    format: int64
    minimum: 1
    maximum: 86400

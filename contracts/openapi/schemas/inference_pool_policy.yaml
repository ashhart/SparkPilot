type: object
additionalProperties: false
required:
- pool_id
- display_name
- revision
- node_ids
- caller_device_ids
- deployment_ids
- router_device_ids
- local_only
- paused
- max_concurrent_requests
- max_concurrent_per_caller
- max_queued_per_caller
- max_queued_requests
- max_buffered_bytes
properties:
  pool_id:
    type: string
    format: uuid
  display_name:
    type: string
    minLength: 1
    maxLength: 80
  revision:
    type: integer
    format: int64
    minimum: 1
    maximum: 9223372036854775807
  node_ids:
    type: array
    items:
      type: string
      format: uuid
    minItems: 1
    maxItems: 16
  caller_device_ids:
    type: array
    items:
      type: string
      format: uuid
    minItems: 1
    maxItems: 64
  deployment_ids:
    type: array
    items:
      type: string
    minItems: 1
    maxItems: 16
  router_device_ids:
    type: array
    items:
      type: string
      format: uuid
    minItems: 1
    maxItems: 1
  local_only:
    type: boolean
    const: true
  paused:
    type: boolean
  max_concurrent_requests:
    type: integer
    format: int64
    minimum: 1
    maximum: 128
  max_concurrent_per_caller:
    type: integer
    format: int64
    minimum: 1
    maximum: 128
  max_queued_per_caller:
    type: integer
    format: int64
    minimum: 0
    maximum: 32
  max_queued_requests:
    type: integer
    format: int64
    minimum: 0
    maximum: 128
  max_buffered_bytes:
    type: integer
    format: int64
    minimum: 1
    maximum: 67108864

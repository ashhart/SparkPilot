type: object
additionalProperties: false
required:
- id
- node_id
- model_id
- profile_id
- due_at
- expires_at
- state
- result_code
- operation_id
- created_at
- updated_at
properties:
  id:
    type: string
    format: uuid
  node_id:
    type: string
    format: uuid
  model_id:
    type: string
  profile_id:
    type: string
  due_at:
    type: integer
    format: int64
  expires_at:
    type: integer
    format: int64
  state:
    type: string
    enum:
    - pending
    - dispatching
    - running
    - succeeded
    - skipped
    - failed
    - disabled
    - revoked
    - expired
    - interrupted
  result_code:
    type: string
  operation_id:
    type:
    - string
    - 'null'
    format: uuid
  created_at:
    type: integer
    format: int64
  updated_at:
    type: integer
    format: int64

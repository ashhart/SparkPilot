type: object
additionalProperties: false
required:
- projectId
- commit
- source_sha256
properties:
  projectId:
    type: string
    format: uuid
  commit:
    type: string
    pattern: ^[0-9a-f]{40}$
  source_sha256:
    type: string
    pattern: ^[0-9a-f]{64}$
  scheme:
    type: string
    minLength: 1
    maxLength: 200
    default: SparkApp
  configuration:
    type: string
    minLength: 1
    maxLength: 100
    default: Debug
  destination:
    type: string
    minLength: 1
    maxLength: 500
    default: platform=macOS
  actions:
    type: array
    minItems: 1
    maxItems: 2
    items:
      type: string
      enum:
      - build
      - test
    default:
    - build
  timeout_seconds:
    type: integer
    minimum: 60
    maximum: 1800
    default: 1800
  requirements:
    $ref: ../../openapi.yaml#/components/schemas/BuildRequirements

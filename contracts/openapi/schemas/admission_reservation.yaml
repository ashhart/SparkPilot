type: object
additionalProperties: false
required:
- reservation_id
- engine_instance_id
- capacity_released
- node_id
- request_id
- attempt_id
- pool_id
- caller_device_id
- deployment_id
- policy_revision
- context_budget
- output_budget
- state
- expires_at
- reason
properties:
  reservation_id:
    type: string
    format: uuid
  engine_instance_id:
    type: string
    format: uuid
  capacity_released:
    type: boolean
    description: Capacity is free only after terminal backend evidence or confirmed owned-engine termination;
      an unknown output may remain unknown
  node_id:
    type: string
    format: uuid
  request_id:
    type: string
    format: uuid
  attempt_id:
    type: string
    format: uuid
  pool_id:
    type: string
    format: uuid
  caller_device_id:
    type: string
    format: uuid
  deployment_id:
    type: string
    pattern: ^[a-f0-9]{64}$
  policy_revision:
    type: integer
    format: int64
    minimum: 0
  context_budget:
    type: integer
    format: int64
    minimum: 0
  output_budget:
    type: integer
    format: int64
    minimum: 0
    maximum: 4294967295
  state:
    $ref: ../../openapi.yaml#/components/schemas/ReservationState
  expires_at:
    type: integer
    format: int64
  reason:
    type:
    - string
    - 'null'

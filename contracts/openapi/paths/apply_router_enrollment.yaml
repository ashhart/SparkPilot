parameters:
- name: challenge_id
  in: path
  required: true
  schema:
    type: string
    format: uuid
post:
  tags:
  - Inference
  operationId: applyRouterEnrollment
  summary: Consume the challenge and enroll a restricted pool router
  responses:
    '200':
      description: Consume the challenge and enroll a restricted pool router
      content:
        application/json:
          schema:
            $ref: ../../openapi.yaml#/components/schemas/EnrolledRouterPrincipal
    default:
      $ref: ../../openapi.yaml#/components/responses/Error
  parameters:
  - $ref: ../../openapi.yaml#/components/parameters/IdempotencyKey
  - $ref: ../../openapi.yaml#/components/parameters/RequiredUserPresence
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/RouterEnrollmentProof
  description: Fresh owner presence consumes a possession proof for the same recipient and challenge.
    The principal can reach only scoped pool capability, reservation, execution, status and cancellation
    routes; it receives no ordinary chat, project or management authority. Pool policy and grants remain
    separately required.

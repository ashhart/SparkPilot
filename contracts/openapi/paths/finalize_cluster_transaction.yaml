post:
  tags:
  - Cluster
  operationId: finalizeClusterTransaction
  summary: Publish READY only after signed commit receipts from every proposed member
  parameters:
  - $ref: ../../openapi.yaml#/components/parameters/IdempotencyKey
  - $ref: ../../openapi.yaml#/components/parameters/RequiredUserPresence
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/FinalizeClusterTransaction
  responses:
    '200':
      description: Two-sided cluster identity is now READY
      content:
        application/json:
          schema:
            $ref: ../../openapi.yaml#/components/schemas/Cluster
    default:
      $ref: ../../openapi.yaml#/components/responses/Error

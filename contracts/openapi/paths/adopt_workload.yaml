post:
  tags:
  - Workloads
  operationId: adoptWorkload
  parameters:
  - name: workload_id
    in: path
    required: true
    schema:
      type: string
      minLength: 64
      maxLength: 64
      pattern: ^[0-9a-fA-F]+$
  - $ref: ../../openapi.yaml#/components/parameters/IdempotencyKey
  - $ref: ../../openapi.yaml#/components/parameters/RequiredUserPresence
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/WorkloadAdoptionRequest
  responses:
    '202':
      description: Durable adoption operation
      content:
        application/json:
          schema:
            $ref: ../../openapi.yaml#/components/schemas/Operation
    default:
      $ref: ../../openapi.yaml#/components/responses/Error

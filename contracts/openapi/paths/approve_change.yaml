parameters:
- $ref: ../../openapi.yaml#/components/parameters/ProjectId
- $ref: ../../openapi.yaml#/components/parameters/ChangeId
post:
  tags:
  - Projects
  operationId: approveChange
  summary: Approve and merge the exact reviewed evidence digest
  parameters:
  - $ref: ../../openapi.yaml#/components/parameters/IdempotencyKey
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          required:
          - review_digest
          properties:
            review_digest:
              type: string
              pattern: ^[0-9a-f]{64}$
            comment:
              type: string
              maxLength: 4000
  responses:
    '200':
      description: Reviewed change merged, or an exact idempotent replay
      content:
        application/json:
          schema:
            $ref: ../../openapi.yaml#/components/schemas/ProjectChangeDecision
    '409':
      description: Change is not in review
      content:
        application/json:
          schema:
            $ref: ../../openapi.yaml#/components/schemas/ErrorEnvelope
    default:
      $ref: ../../openapi.yaml#/components/responses/Error

get:
  tags:
  - Models
  operationId: listProviderCredentials
  responses:
    '200':
      description: Active provider credential references; secrets are never returned
      content:
        application/json:
          schema:
            $ref: ../../openapi.yaml#/components/schemas/ProviderCredentialList
    default:
      $ref: ../../openapi.yaml#/components/responses/Error
post:
  tags:
  - Models
  operationId: addProviderCredential
  parameters:
  - $ref: ../../openapi.yaml#/components/parameters/IdempotencyKey
  - $ref: ../../openapi.yaml#/components/parameters/RequiredUserPresence
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/AddProviderCredentialRequest
  responses:
    '201':
      description: Credential reference; the secret is never returned
      content:
        application/json:
          schema:
            $ref: ../../openapi.yaml#/components/schemas/ProviderCredential
    default:
      $ref: ../../openapi.yaml#/components/responses/Error

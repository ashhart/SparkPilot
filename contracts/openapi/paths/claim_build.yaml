parameters:
- $ref: ../../openapi.yaml#/components/parameters/WorkerId
post:
  tags:
  - Builds
  operationId: claimBuild
  summary: Claim the oldest project-authorised job matching this worker
  parameters:
  - $ref: ../../openapi.yaml#/components/parameters/IdempotencyKey
  responses:
    '200':
      description: Node-signed recipe and renewable lease
      content:
        application/json:
          schema:
            $ref: ../../openapi.yaml#/components/schemas/BuildClaim
    '404':
      description: No compatible project-authorised job is queued
      content:
        application/json:
          schema:
            $ref: ../../openapi.yaml#/components/schemas/ErrorEnvelope
    '409':
      description: The worker has no free advertised concurrency slot
      content:
        application/json:
          schema:
            $ref: ../../openapi.yaml#/components/schemas/ErrorEnvelope
    default:
      $ref: ../../openapi.yaml#/components/responses/Error

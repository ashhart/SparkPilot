post:
  tags:
  - Inference
  operationId: applyInferencePool
  summary: Apply the reviewed policy and withdraw old grants
  parameters:
  - $ref: ../../openapi.yaml#/components/parameters/IdempotencyKey
  - $ref: ../../openapi.yaml#/components/parameters/RequiredUserPresence
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/ApplyPoolPolicyRequest
  responses:
    '200':
      description: Apply the reviewed policy and withdraw old grants
      content:
        application/json:
          schema:
            $ref: ../../openapi.yaml#/components/schemas/InferencePoolPolicy
    default:
      $ref: ../../openapi.yaml#/components/responses/Error

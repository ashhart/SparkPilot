post:
  tags:
  - Cluster
  operationId: activateClusterTransaction
  summary: Activate this transaction's prepared CX-7 profile without publishing membership
  parameters:
  - $ref: ../../openapi.yaml#/components/parameters/IdempotencyKey
  - $ref: ../../openapi.yaml#/components/parameters/RequiredUserPresence
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/ClusterProposal
  responses:
    '200':
      description: Transaction activation result
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - transaction_id
            - state
            properties:
              transaction_id:
                type: string
                format: uuid
              state:
                type: string
                const: active
    default:
      $ref: ../../openapi.yaml#/components/responses/Error

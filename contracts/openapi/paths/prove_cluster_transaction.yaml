post:
  tags:
  - Cluster
  operationId: proveClusterTransaction
  summary: Prove this Spark's assigned peer over its transaction-owned ConnectX profile
  parameters:
  - $ref: ../../openapi.yaml#/components/parameters/IdempotencyKey
  - $ref: ../../openapi.yaml#/components/parameters/RequiredUserPresence
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/ClusterProposal
  responses:
    '200':
      description: Node-authority signed physical-link proof
      content:
        application/json:
          schema:
            $ref: ../../openapi.yaml#/components/schemas/ClusterLinkProof
    default:
      $ref: ../../openapi.yaml#/components/responses/Error

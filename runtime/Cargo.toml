[workspace]
resolver = "2"
members = [
  "crates/spark-core",
  "crates/spark-contracts",
  "crates/sparkd",
  "crates/spark-privd",
  "crates/spark-jobs",
  "crates/spark-models",
  "crates/spark-telemetry",
  "crates/spark-project-runner",
  "crates/spark-installer",
  "crates/spark-updater",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.94"
version = "0.1.13"
repository = "https://example.invalid/spark-fabric"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["http2", "macros", "ws"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
futures = "0.3"
hex = "0.4"
libc = "0.2"
mdns-sd = "0.21"
nix = { version = "0.30", features = ["socket", "user", "signal", "term", "process", "poll", "fs"] }
p256 = { version = "0.13", features = ["ecdsa", "ecdh", "pkcs8"] }
parking_lot = "0.12"
rand = "0.9"
rcgen = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "uuid", "time"] }
thiserror = "2"
toml = "0.8"
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tower = { version = "0.5", features = ["limit", "timeout", "util"] }
tower-http = { version = "0.6", features = ["catch-panic", "cors", "limit", "request-id", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
unicode-normalization = "0.1"
uuid = { version = "1", features = ["serde", "v4", "v7"] }
zeroize = { version = "1", features = ["derive"] }

[profile.release]
lto = "thin"
strip = "symbols"

[package]
name = "spark-project-runner"
description = "Project environments, PTYs, Git worktrees, tests, and previews."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Host shells bypass containers; this development-only feature is absent from defaults and release packages.
host-pty = []

[dependencies]
nix = { workspace = true, features = ["term", "process", "poll", "dir"] }
serde.workspace = true
serde_json.workspace = true
spark-core = { path = "../spark-core" }
spark-privd = { path = "../spark-privd" }
thiserror.workspace = true
uuid.workspace = true
url = "2"

tempfile = "3"
